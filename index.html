<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Más Vistas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #58a6ff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #30363d;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background-color: #010409;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .card h3 {
            font-size: 1.1em;
            margin-bottom: 8px;
        }
        .badge {
            background-color: #238636;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .year {
            color: #8b949e;
            font-size: 0.85em;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <h1>Series Más Vistas (2006 - 2013)</h1>

    <div class="grid">
        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/en/8/86/Avatar_The_Last_Airbender_logo.svg" alt="Avatar">
            <h3>Avatar: The Last Airbender</h3>
            <div><span class="badge">TOP</span><span class="year">2005 - 2008</span></div>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/The_Office_US_logo.svg" alt="The Office">
            <h3>The Office</h3>
            <div><span class="badge">TOP</span><span class="year">2005 - 2013</span></div>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/Supernatural_logo.svg" alt="Supernatural">
            <h3>Supernatural</h3>
            <div><span class="badge">TOP</span><span class="year">2005 - 2020</span></div>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/17/Dexter_logo.svg" alt="Dexter">
            <h3>Dexter</h3>
            <div><span class="badge">TOP</span><span class="year">2006 - 2013</span></div>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Breaking_Bad_logo.svg" alt="Breaking Bad">
            <h3>Breaking Bad</h3>
            <div><span class="badge">TOP</span><span class="year">2008 - 2013</span></div>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/The_Walking_Dead_logo.svg" alt="The Walking Dead">
            <h3>The Walking Dead</h3>
            <div><span class="badge">TOP</span><span class="year">2010 - 2022</span></div>
        </div>
    </div>

</body>
</html>
