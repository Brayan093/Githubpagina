<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Más Vistas (2006 - 2013)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Amazon Ember', Arial, sans-serif;
            background-color: #0f1721;
            color: #ffffff;
            padding: 30px;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Contenedor con desplazamiento horizontal de izquierda a derecha */
        .carousel-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 10px 5px 20px 5px;
            scroll-behavior: smooth;
        }

        /* Personalización de la barra de desplazamiento */
        .carousel-container::-webkit-scrollbar {
            height: 8px;
        }

        .carousel-container::-webkit-scrollbar-thumb {
            background: #1b2533;
            border-radius: 4px;
        }

        .carousel-container::-webkit-scrollbar-thumb:hover {
            background: #00a8e1;
        }

        /* Tarjeta de serie estilo Prime Video */
        .card {
            flex: 0 0 210px;
            background-color: #1b2533;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.25s ease, border 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
            border: 2px solid #00a8e1;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
        }

        .card img {
            width: 100%;
            height: 290px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8197a4;
        }

        .badge {
            background-color: #00a8e1;
            color: #0f1721;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Series Más Vistas (2006 - 2013)</h1>
    </header>

    <div class="carousel-container">

        <!-- Serie 1 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/M/MVBmM2MyZjg5NWUtNWU0OC00ODA3LTk1M2ItZDA3NjA1MmVkOWE1XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Avatar The Last Airbender">
            <div class="card-info">
                <div class="card-title">Avatar: The Last Airbender</div>
                <div class="card-meta">
                    <span class="badge">TOP</span>
                    <span>2005 - 2008</span>
                </div>
            </div>
        </div>

        <!-- Serie 2 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/M/MVBMTUxNzg0MDM2Ml5BMl5BanBnXkFtZTcwMTgwODI1OQ@@._V1_FMjpg_UX1000_.jpg" alt="The Office">
            <div class="card-info">
                <div class="card-title">The Office</div>
                <div class="card-meta">
                    <span class="badge">TOP</span>
                    <span>2005 - 2013</span>
                </div>
            </div>
        </div>

        <!-- Serie 3 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/M/MVBMTI2MTA2NTExMV5BMl5BanBnXkFtZTcwOTY5NjAwMw@@._V1_FMjpg_UX1000_.jpg" alt="Supernatural">
            <div class="card-info">
                <div class="card-title">Supernatural</div>
                <div class="card-meta">
                    <span class="badge">TOP</span>
                    <span>2005 - 2020</span>
                </div>
            </div>
        </div>

        <!-- Serie 4 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/M/MVBMjE3NTcxNzE5N15BMl5BanBnXkFtZTgwMDUyMDIzNjE@._V1_FMjpg_UX1000_.jpg" alt="Dexter">
            <div class="card-info">
                <div class="card-title">Dexter</div>
                <div class="card-meta">
                    <span class="badge">TOP</span>
                    <span>2006 - 2013</span>
                </div>
            </div>
        </div>

        <!-- Serie 5 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/M/MVBY2U3M2I4YjAtOTU2NC00NzdjLTk3ZmUtYWNmZTdhODRjNmM4XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Breaking Bad">
            <div class="card-info">
                <div class="card-title">Breaking Bad</div>
                <div class="card-meta">
                    <span class="badge">TOP</span>
                    <span>2008 - 2013</span>
                </div>
            </div>
        </div>

        <!-- Serie 6 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/M/MVBMTk5MTAyODk1N15BMl5BanBnXkFtZTcwNDI2MDcxOQ@@._V1_FMjpg_UX1000_.jpg" alt="The Walking Dead">
            <div class="card-info">
                <div class="card-title">The Walking Dead</div>
                <div class="card-meta">
                    <span class="badge">TOP</span>
                    <span>2010 - 2022</span>
                </div>
            </div>
        </div>

        <!-- Serie 7 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/M/MVBN2EyNWNmMDgtNWJiNC00MDcxLWE1NWItOTI5MDEyM2M5YzA2XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Game of Thrones">
            <div class="card-info">
                <div class="card-title">Game of Thrones</div>
                <div class="card-meta">
                    <span class="badge">TOP</span>
                    <span>2011 - 2019</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
